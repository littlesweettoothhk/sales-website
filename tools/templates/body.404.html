<body class="nf-page">
{{>part.header}}

  <main id="main">
  <section class="nf">
    <div class="wrap">
      <img class="nf-mascot" src="/src/mascot.webp" alt="" width="520" height="301" decoding="async">
      <p class="eyebrow">{{t:nf.eyebrow}}</p>
      <h1>{{t:nf.title}}</h1>
      <p class="sec-sub">{{t:nf.body}}</p>
      <div class="nf-acts">
        <a class="btn btn-solid" href="/">{{t:nf.home}}</a>
        <a class="btn btn-line" href="/#menu">{{t:nf.menu}}</a>
        <a class="btn btn-line" href="/#contact">{{t:nf.contact}}</a>
      </div>
      <p class="nf-en">{{t:nf.other}}</p>
    </div>
  </section>
  </main>

{{>part.footer}}
</body>
</html>
