  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load off the critical path. A firewall that drops requests to
       Google rather than refusing them (mainland China, some corporate wifi)
       would otherwise hold first paint for ~15s on a render-blocking
       stylesheet. preload fetches it at full priority without blocking, then
       applies it; display=swap in the URL handles the font files themselves. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&family=Shantell+Sans:wght@700&display=swap" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&family=Shantell+Sans:wght@700&display=swap"></noscript>
  <link rel="stylesheet" href="{{R}}styles.css">
  <link rel="manifest" href="{{R}}site.webmanifest">{{@preload}}
