  <footer class="foot">
    <div class="wrap">
      <div class="foot-grid">
        <div class="foot-brand">
          <img class="foot-mascot" src="{{R}}src/mascot.webp" alt="" width="520" height="301" loading="lazy" decoding="async">
          <p class="foot-blurb">{{t:foot.blurb}}</p>
          <div class="foot-social">
            <a class="round" href="{{@ig}}" target="_blank" rel="noopener" aria-label="Instagram">{{@icon_ig}}</a>
            <a class="round" href="{{@wa}}" target="_blank" rel="noopener" aria-label="WhatsApp">{{@icon_wa}}</a>
          </div>
        </div>
        <div class="foot-col">
          <h2 class="foot-h">{{t:foot.more}}</h2>
          <ul>
{{@nav_foot}}
          </ul>
        </div>
        <div class="foot-col">
          <h2 class="foot-h">{{t:foot.delivery}}</h2>
          <ul class="foot-info">

          </ul>
        </div>
      </div>
